# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: accetto/ubuntu-vnc-xfce-firefox-g3:24.04
      ports: [ 3306 ]

    steps:
    - name: Prepare MySQL env
      run: |
        echo headless | sudo -S apt-get update --yes
        echo headless | sudo -S apt-get install --yes libnuma1
        echo headless | sudo -S apt-get install --yes libaio1t64
        echo headless | sudo -S apt-get install --yes libncurses6
        echo headless | sudo -S ln -sf libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
    - name: Prepare Firefox env
      run: |
        mkdir -p /opt && pushd /opt
        wget -qO- https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz | tar xzf -
        echo headless | sudo -S ln -fs /opt/geckodriver /snap/bin/geckodriver
        
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven
    - uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.16
    - name: Build with Maven
      run: |
          java --version
          mvn --version
          echo headless | sudo -S mkdir -p /home/headless/.m2/repository
          echo headless | sudo -S chown -R headless:headless /home/headless/.m2
          mvn clean verify
